<style>

      --texto: #eeeeee;
      --suave: #aaaaaa;
      --borde: #444444;
      --boton: #dddddd;
      --boton-texto: #111111;

  * { box-sizing: border-box; }
  body {
    margin: 0;

  main { max-width: 440px; margin: 0 auto; padding: 16px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }

  header .aviso { font-size: 12px; color: var(--suave); border: 1px dashed var(--borde); padding: 2px 6px; }

  h2 { font-size: 17px; margin: 18px 0 6px; }
  p { margin: 8px 0; }
  .ayuda { color: var(--suave); font-size: 16px; }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 8px; padding: 12px 14px; margin: 10px 0; }
  ul { margin: 6px 0; padding-left: 20px; }
  li { margin: 4px 0; }
  button, .boton {
    display: block; width: 100%; min-height: 48px; margin: 8px 0; padding: 13px 14px;
    font: inherit; text-align: left; cursor: pointer;
    background: var(--tarjeta); color: var(--texto);
    border: 1px solid var(--borde); border-radius: 8px; text-decoration: none;
  }
  button.principal, .boton.principal { background: var(--boton); color: var(--boton-texto); border-color: var(--boton); text-align: center; font-weight: 600; }
  button.chico { display: inline-block; width: auto; min-height: 0; padding: 6px 10px; font-size: 14px; margin: 0; }
  .volver { border: none; background: none; min-height: 0; padding: 4px 0; width: auto; color: var(--suave); font-size: 15px; margin: 0 0 4px; }
  .semaforo { border-radius: 8px; padding: 14px; color: #fff; margin: 8px 0 12px; }
  .semaforo.amarillo { color: #1f1f1f; }
  .semaforo.rojo { background: var(--rojo); }
  .semaforo.amarillo { background: var(--amarillo); }
  .semaforo.verde { background: var(--verde); }
  .semaforo .nivel { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; opacity: .9; }
  .semaforo .titulo { font-size: 20px; font-weight: 700; margin-top: 2px; }
  .luces { display: flex; gap: 6px; margin-bottom: 6px; }
  .luces span { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.35); border: 1px solid rgba(0,0,0,.2); }
  .luces span.on { background: #fff; }
  .parar { border-left: 4px solid var(--rojo); padding: 8px 10px; margin: 10px 0; background: var(--tarjeta); }
  .parar b { color: var(--rojo); }
  .instruccion { font-size: 22px; font-weight: 700; line-height: 1.3; background: var(--tarjeta); border: 2px solid var(--rojo); border-radius: 8px; padding: 14px; margin: 8px 0; }
  h1:focus { outline: none; }
  .check { display: flex; gap: 10px; align-items: flex-start; }
  .check input { width: 22px; height: 22px; margin-top: 2px; flex: none; }
  pre.ficha { white-space: pre-wrap; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 8px; padding: 12px; }
  textarea { width: 100%; min-height: 120px; font: inherit; padding: 10px; border: 1px solid var(--borde); border-radius: 8px; background: var(--tarjeta); color: var(--texto); }
  .notas { font-size: 14px; color: var(--suave); }
  .puntaje { display: flex; gap: 6px; }
  .puntaje button { text-align: center; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td { border-bottom: 1px solid var(--borde); padding: 4px; vertical-align: top; }

</head>

const app = document.getElementById('app');
let ctx, historial = [];

function guardarRegistro(lista) {
  try { localStorage.setItem('semaforo_registro', JSON.stringify(lista)); } catch (e) {}
}
function leerRegistro() {
  try { return JSON.parse(localStorage.getItem('semaforo_registro') || '[]'); } catch (e) { return []; }
}
function registrar(evento, detalle) {
  const lista = leerRegistro();
  lista.push({ hora: new Date().toLocaleString('es-UY'), ms: Date.now(), evento, detalle: detalle || '' });
  guardarRegistro(lista);
}

function nuevoContexto() {
  return { caso: null, alarmas: [], respuestas: [], pasos: [], alquila: null, nivel: null, resultado: null, otro: '' };
}

function ir(pantalla, args) {
  historial.push({ pantalla, args, ctx: JSON.stringify(ctx) });
  render(pantalla, args);
}
function volver() {
  if (historial.length < 2) return;
  historial.pop();
  const anterior = historial[historial.length - 1];
  ctx = JSON.parse(anterior.ctx);
  registrar('volver atrás', anterior.pantalla);
  render(anterior.pantalla, anterior.args);
}

function el(html) {
  app.innerHTML = html;
  window.scrollTo(0, 0);
  const titulo = app.querySelector('h1');
  if (titulo) { titulo.tabIndex = -1; titulo.focus({ preventScroll: true }); }
}
function copiarTexto(texto) {
  const alternativa = () => {
    const t = document.createElement('textarea');
    t.value = texto;
    t.setAttribute('readonly', '');
    t.style.position = 'fixed';
    t.style.opacity = '0';
    document.body.appendChild(t);
    t.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    t.remove();
    return ok;
  };
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(texto).then(() => true, alternativa);
  return Promise.resolve(alternativa());
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function encabezado(conVolver) {
  return `<header><span class="marca">Semáforo del hogar</span><span class="aviso">Prototipo</span></header>` +
    (conVolver && historial.length > 1 ? `<button class="volver" data-accion="volver">Volver</button>` : '');
}
function lista(items) { return `<ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`; }

function nodo(id) {
  if (id === 'resuelto') return RESUELTO;
  if (COMUNES[id]) return COMUNES[id];
  return CASOS[ctx.caso].nodos[id];
}

function armarFicha() {
  const hoy = new Date().toLocaleDateString('es-UY');
  const nivel = { rojo: 'Rojo, no tocar', amarillo: 'Amarillo, con cuidado', verde: 'Verde, lo puedo hacer yo' }[ctx.nivel] || 'Sin evaluar';
  const l = [];
  l.push('FICHA DEL PROBLEMA');
  l.push(`Fecha: ${hoy}`);
  l.push(`Problema: ${ctx.caso ? CASOS[ctx.caso].titulo : ctx.alarmas.length ? 'Señal de alarma' : 'Otro'}`);
  if (ctx.otro) l.push(`Lo que pasa: ${ctx.otro}`);
  l.push(`Señales de alarma: ${ctx.alarmas.length ? ctx.alarmas.map(id => ALARMAS.find(a => a.id === id).label).join(', ') : 'ninguna'}`);
  if (ctx.respuestas.length) {
    l.push('');
    l.push('Lo que respondí:');
    ctx.respuestas.forEach(x => l.push(`- ${x.p} ${x.r}`));
  }
  if (ctx.pasos.length) {
    l.push('');
    l.push('Lo que ya probé:');
    ctx.pasos.forEach(x => l.push(`- ${x}`));
  }
  l.push('');
  l.push(`Nivel: ${nivel}${ctx.resultado ? '. ' + ctx.resultado : ''}`);
  l.push(`Vivienda: ${ctx.alquila === null ? 'no indicado' : ctx.alquila ? 'alquilada' : 'propia'}`);
  l.push('Fotos: se adjuntan en la versión real');
  return l.join('\n');
}

function empezarCaso(id, desde) {
  ctx.caso = id;
  registrar('caso', CASOS[id].titulo + (desde ? ` (desde: ${desde})` : ''));
  avanzar(CASOS[id].inicio);
}

function avanzar(id, nota) {
  const n = nodo(id);
  if (n.tipo === 'pregunta') { ir('pregunta', { id }); return; }
  if (CASOS[ctx.caso]?.preguntarAlquiler && ctx.alquila === null && !n.urgente) { ir('alquiler', { id, nota }); return; }
  ir('resultado', { id, nota });
}

function render(pantalla, args) { PANTALLAS[pantalla](args || {}); }

app.addEventListener('click', e => {
  const t = e.target.closest('button, a');
  if (!t) return;
  if (t.dataset.ir) { if (t.dataset.ir === 'alarmas') registrar('inicio', ''); ir(t.dataset.ir); return; }
  if (t.dataset.caso) { empezarCaso(t.dataset.caso); return; }
  switch (t.dataset.accion) {
    case 'volver': volver(); break;
    case 'confirmarAlarmas': {
      ctx.alarmas = [...app.querySelectorAll('input:checked')].map(i => i.value);
      registrar('alarmas', ctx.alarmas.join(', ') || 'ninguna');
      if (ctx.alarmas.length) {
        ctx.caso = null;
        ir('resultado', { id: ALARMAS.find(a => a.id === ctx.alarmas[0]).ir, nota: ctx.alarmas.length > 1 ? 'Marcaste más de una señal. Empezamos por la más urgente.' : '' });
      } else ir('categoria');
      break;
    }
    case 'ficha': ir('ficha'); break;
    case 'cierre': ir('cierre'); break;
    case 'reiniciar': iniciar(); break;
    case 'borrarRegistro': guardarRegistro([]); render('registro'); break;
  }
});

function iniciar() {
  ctx = nuevoContexto();
  historial = [];
  if (location.hash === '#registro') { history.replaceState(null, '', location.pathname); }
  ir('inicio');
}

window.addEventListener('hashchange', () => { if (location.hash === '#registro') render('registro'); });
if (location.hash === '#registro') { ctx = nuevoContexto(); render('registro'); } else iniciar();
</script>
</body>
